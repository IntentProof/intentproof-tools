# IntentProof tiered coverage (intentproof-tools)
# Total floor applies to all packages in run-coverage-gate.sh.
# Critical rules: MIN_PERCENT:PATH_FRAGMENT (must match cover profile paths).
# Target for all critical paths is 95%; floors ratchet upward over time.

TOTAL_MIN=90

CRITICAL_RULES=(
  "95:/pkg/attestation/"
  "95:/pkg/merkle/"
  "95:/pkg/policy/"
  "95:/pkg/verifier/"
  "93:/pkg/bundle/"
  "93:/pkg/canon/"
  "93:/pkg/crypto/"
  "92:/pkg/policysig/"
)
