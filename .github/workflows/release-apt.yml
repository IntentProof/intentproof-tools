name: release apt

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag to package for a dry run.
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-apt-repo:
    name: "IntentProof Release: Build Apt Repository"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve release metadata
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$INPUT_RELEASE_TAG"
          else
            release_tag="$EVENT_RELEASE_TAG"
          fi
          [[ "$release_tag" =~ ^v[0-9]+[.][0-9]+[.][0-9]+ ]] || {
            echo "release_tag must start with a SemVer tag such as v1.2.3" >&2
            exit 1
          }
          git fetch --tags --force origin "$release_tag"
          release_commit="$(git rev-list -n 1 "$release_tag")"
          source_date_epoch="$(git log -1 --format=%ct "$release_commit")"
          git checkout --detach "$release_commit"
          {
            echo "release_tag=$release_tag"
            echo "release_version=${release_tag#v}"
            echo "release_commit=$release_commit"
            echo "source_date_epoch=$source_date_epoch"
          } >> "$GITHUB_OUTPUT"

      - name: Install package tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gzip
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3

      - name: Build apt repository layout
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          SOURCE_DATE_EPOCH: ${{ steps.release.outputs.source_date_epoch }}
        run: ./scripts/build-apt-repo.sh

      - name: Upload apt repository artifact
        uses: actions/upload-artifact@v4
        with:
          name: apt-repository-layout
          path: dist/apt
