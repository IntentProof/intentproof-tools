name: release homebrew

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag to publish into the tap.
        required: true
        type: string

permissions:
  contents: read

jobs:
  bump-homebrew-tap:
    name: "IntentProof Release: Bump Homebrew Tap"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$INPUT_RELEASE_TAG"
          else
            release_tag="$EVENT_RELEASE_TAG"
          fi
          [[ "$release_tag" =~ ^v[0-9]+[.][0-9]+[.][0-9]+ ]] || {
            echo "release_tag must start with a SemVer tag such as v1.2.3" >&2
            exit 1
          }
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "branch=bump-intentproof-tools-${release_tag#v}" >> "$GITHUB_OUTPUT"

      - name: Require tap update token
        env:
          TAP_TOKEN: ${{ secrets.INTENTPROOF_HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TAP_TOKEN" || {
            echo "INTENTPROOF_HOMEBREW_TAP_TOKEN is required to update the tap" >&2
            exit 1
          }

      - name: Checkout Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: IntentProof/homebrew-tap
          token: ${{ secrets.INTENTPROOF_HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
          fetch-depth: 0

      - name: Render formulae from release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            gh release view "$RELEASE_TAG" \
              --repo IntentProof/intentproof-tools \
              --json assets \
              > release-assets.json
            if python3 ./scripts/render-homebrew-formulas.py \
              --release-tag "$RELEASE_TAG" \
              --assets-json release-assets.json \
              --output-dir homebrew-tap/Formula; then
              exit 0
            fi
            echo "Release assets are not complete yet; retrying ($attempt/30)."
            sleep 20
          done
          echo "Timed out waiting for signed release assets for $RELEASE_TAG" >&2
          exit 1

      - name: Open tap pull request
        env:
          GH_TOKEN: ${{ secrets.INTENTPROOF_HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          TAP_BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          set -euo pipefail
          cd homebrew-tap
          git switch -c "$TAP_BRANCH"
          if [[ -z "$(git status --porcelain -- Formula)" ]]; then
            echo "Homebrew formulae are already current for $RELEASE_TAG."
            exit 0
          fi
          git add Formula/intentproof.rb Formula/intentproof-verify.rb
          git \
            -c user.name="IntentProof Release Bot" \
            -c user.email="release-bot@intentproof.io" \
            commit -s -m "Bump IntentProof formulae to ${RELEASE_TAG#v}"
          git push -u origin "$TAP_BRANCH"
          gh pr create \
            --repo IntentProof/homebrew-tap \
            --base main \
            --head "$TAP_BRANCH" \
            --title "Bump IntentProof formulae to ${RELEASE_TAG#v}" \
            --body "Updates the IntentProof Homebrew formulae to GitHub Release $RELEASE_TAG."
