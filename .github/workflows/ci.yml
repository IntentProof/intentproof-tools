name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: "IntentProof CI: Build and Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read pinned spec ref
        id: spec_ref
        run: |
          ref=$(cat SPEC_REF)
          if ! echo "$ref" | grep -qE '^[0-9a-fA-F]{40}$'; then
            echo "Invalid SPEC_REF: must be a full 40-character hex SHA, got '$ref'" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout intentproof-spec at pinned ref
        uses: actions/checkout@v6
        with:
          repository: IntentProof/intentproof-spec
          ref: ${{ steps.spec_ref.outputs.ref }}
          path: intentproof-spec

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: go build
        run: go build ./...

      - name: go test
        env:
          INTENTPROOF_LOCAL_OPEN_BROWSER: "0"
          INTENTPROOF_SPEC_DIR: ${{ github.workspace }}/intentproof-spec
        run: go test -count=1 ./...

      - name: Verify counterparty golden bundle stdout
        env:
          INTENTPROOF_SPEC_DIR: ${{ github.workspace }}/intentproof-spec
        run: bash ./scripts/check-counterparty-golden.sh
