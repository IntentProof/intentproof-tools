name: fuzz

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      fuzz_time:
        description: Go fuzz duration (for example 30m or 1h)
        required: false
        default: "30m"

permissions:
  contents: read

jobs:
  canon-fuzz:
    name: "IntentProof Security: JCS Fuzz"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned spec ref
        id: spec_ref
        run: |
          ref=$(cat SPEC_REF)
          if ! echo "$ref" | grep -qE '^[0-9a-fA-F]{40}$'; then
            echo "Invalid SPEC_REF: must be a full 40-character hex SHA, got '$ref'" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout intentproof-spec at pinned ref
        uses: actions/checkout@v4
        with:
          repository: IntentProof/intentproof-spec
          ref: ${{ steps.spec_ref.outputs.ref }}
          path: intentproof-spec

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run fuzz gate
        run: |
          SPEC_ABS="$(cd intentproof-spec && pwd)"
          export INTENTPROOF_SPEC_DIR="$SPEC_ABS"
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            export FUZZ_TIME=30m
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            export FUZZ_TIME="${{ inputs.fuzz_time }}"
          fi
          bash ./scripts/run-fuzz-gate.sh

      - name: Upload fuzz corpus on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-canon
          path: pkg/canon/testdata/fuzz/FuzzMarshalRaw/
          if-no-files-found: ignore
