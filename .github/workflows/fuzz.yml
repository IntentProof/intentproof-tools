name: fuzz

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      fuzz_time:
        description: Go fuzz duration per target (for example 30m or 1h)
        required: false
        default: "30m"

permissions:
  contents: read

jobs:
  platform-fuzz:
    name: "IntentProof Security: Platform Fuzz"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned spec ref
        id: spec_ref
        run: |
          ref=$(cat SPEC_REF)
          if ! echo "$ref" | grep -qE '^[0-9a-fA-F]{40}$'; then
            echo "Invalid SPEC_REF: must be a full 40-character hex SHA, got '$ref'" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout intentproof-spec at pinned ref
        uses: actions/checkout@v4
        with:
          repository: IntentProof/intentproof-spec
          ref: ${{ steps.spec_ref.outputs.ref }}
          path: intentproof-spec

      - name: Read pinned core ref
        id: core_ref
        run: |
          ref=$(cat CORE_REF)
          if ! echo "$ref" | grep -qE '^[0-9a-fA-F]{40}$'; then
            echo "Invalid CORE_REF: must be a full 40-character hex SHA, got '$ref'" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout intentproof-core at pinned ref
        uses: actions/checkout@v4
        with:
          repository: IntentProof/intentproof-core
          ref: ${{ steps.core_ref.outputs.ref }}
          path: intentproof-core

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run fuzz gate
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUT_FUZZ_TIME: ${{ inputs.fuzz_time }}
        run: |
          SPEC_ABS="$(cd intentproof-spec && pwd)"
          CORE_ABS="$(cd intentproof-core && pwd)"
          export INTENTPROOF_SPEC_DIR="$SPEC_ABS"
          export INTENTPROOF_CORE_DIR="$CORE_ABS"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            export FUZZ_TIME=30m
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            export FUZZ_TIME="$INPUT_FUZZ_TIME"
          fi
          bash ./scripts/run-fuzz-gate.sh

      - name: Upload fuzz corpus on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            pkg/canon/testdata/fuzz/
            pkg/verifier/testdata/fuzz/
            pkg/bundle/testdata/fuzz/
            pkg/policy/testdata/fuzz/
            intentproof-core/pkg/ingest/testdata/fuzz/
          if-no-files-found: ignore
