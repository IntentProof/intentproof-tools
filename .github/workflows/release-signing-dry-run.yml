name: release signing dry run

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: SemVer version to place in dry-run attestations.
        required: true
        default: 0.0.0-dryrun
        type: string
      release_ref:
        description: Git ref to check out for the dry run.
        required: true
        default: refs/heads/main
        type: string
      container_image_ref:
        description: Optional digest-bound GHCR image to sign instead of building a test image.
        required: false
        default: ""
        type: string

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  build-test-binary:
    name: "IntentProof Release: Build Test Binary"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build dry-run verifier binary
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w" \
            -o dist/intentproof-verify-dryrun \
            ./cmd/intentproof-verify

      - uses: actions/upload-artifact@v4
        with:
          name: release-dry-run-binary
          path: dist/intentproof-verify-dryrun

  sign-test-binary:
    name: "IntentProof Release: Sign Test Binary"
    needs: build-test-binary
    uses: ./.github/workflows/release-build-sign.yml
    with:
      artifact_kind: binary
      subject_name: intentproof-verify-dryrun
      release_version: ${{ inputs.release_version }}
      release_ref: ${{ inputs.release_ref }}
      artifact_paths: dist/intentproof-verify-dryrun
      artifact_download_name: release-dry-run-binary
      artifact_download_path: dist
      attest_to_rekor: false

  build-test-container:
    name: "IntentProof Release: Build Test Container"
    if: inputs.container_image_ref == ''
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.image-ref.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Prepare dry-run image context
        run: |
          set -euo pipefail
          mkdir -p dist/container-dry-run
          cat > dist/container-dry-run/Dockerfile <<'EOF'
          FROM scratch
          LABEL org.opencontainers.image.source="https://github.com/IntentProof/intentproof-tools"
          LABEL org.opencontainers.image.description="IntentProof release signing dry-run image"
          COPY hello.txt /hello.txt
          EOF
          printf 'intentproof release signing dry run\n' > dist/container-dry-run/hello.txt

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: dist/container-dry-run
          file: dist/container-dry-run/Dockerfile
          push: true
          tags: ghcr.io/intentproof/test-hello:dryrun-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/IntentProof/intentproof-tools
            org.opencontainers.image.version=${{ inputs.release_version }}

      - name: Export digest-bound image ref
        id: image-ref
        run: |
          set -euo pipefail
          echo "image_ref=ghcr.io/intentproof/test-hello@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  sign-test-container:
    name: "IntentProof Release: Sign Test Container"
    needs: build-test-container
    if: always() && (inputs.container_image_ref != '' || needs.build-test-container.result == 'success')
    uses: ./.github/workflows/release-container-sign.yml
    with:
      subject_name: ${{ inputs.container_image_ref != '' && inputs.container_image_ref || needs.build-test-container.outputs.image_ref }}
      release_version: ${{ inputs.release_version }}
      release_ref: ${{ inputs.release_ref }}
      image_ref: ${{ inputs.container_image_ref != '' && inputs.container_image_ref || needs.build-test-container.outputs.image_ref }}
      attest_to_rekor: false
