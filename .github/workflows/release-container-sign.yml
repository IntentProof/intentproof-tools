name: release container sign

on:
  workflow_call:
    inputs:
      subject_name:
        required: true
        type: string
      release_version:
        required: true
        type: string
      release_ref:
        required: true
        type: string
      image_ref:
        required: true
        type: string
      registry:
        required: false
        type: string
        default: "ghcr.io"
      attest_to_rekor:
        required: false
        type: boolean
        default: true

jobs:
  validate:
    name: "IntentProof Release: Validate Container Inputs"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate container signing inputs
        env:
          ATTEST_TO_REKOR: ${{ inputs.attest_to_rekor }}
          IMAGE_REF: ${{ inputs.image_ref }}
          REGISTRY: ${{ inputs.registry }}
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail

          semver_tag='^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          dry_run_ref='^(refs/heads/[0-9A-Za-z._/-]+|[0-9a-fA-F]{40})$'
          if [[ "$ATTEST_TO_REKOR" == "true" ]]; then
            if [[ ! "$RELEASE_REF" =~ $semver_tag ]]; then
              echo "release_ref must be a SemVer tag ref like refs/tags/v1.2.3 when attest_to_rekor=true" >&2
              exit 1
            fi
          elif [[ ! "$RELEASE_REF" =~ $semver_tag && ! "$RELEASE_REF" =~ $dry_run_ref ]]; then
            echo "dry-run release_ref must be a SemVer tag, refs/heads/*, or a full commit SHA" >&2
            exit 1
          fi

          test -n "$IMAGE_REF" || { echo "image_ref is required" >&2; exit 1; }
          test "$REGISTRY" = "ghcr.io" || { echo "only ghcr.io is supported" >&2; exit 1; }
          if [[ ! "$IMAGE_REF" =~ @sha256:[0-9a-fA-F]{64}$ ]]; then
            echo "image_ref must be digest-bound with @sha256:<digest>" >&2
            exit 1
          fi

  container:
    name: "IntentProof Release: Sign Container Image"
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Sign container image and attest SBOM
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
          ATTEST_TO_REKOR: ${{ inputs.attest_to_rekor }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SUBJECT_NAME: ${{ inputs.subject_name }}
        run: |
          set -euo pipefail
          tlog_args=()
          if [[ "$ATTEST_TO_REKOR" != "true" ]]; then
            tlog_args+=(--tlog-upload=false)
          fi

          echo "Signing $SUBJECT_NAME $RELEASE_VERSION at $IMAGE_REF"
          cosign sign --yes "${tlog_args[@]}" "$IMAGE_REF"
          syft packages "$IMAGE_REF" -o spdx-json=image.spdx.json
          cosign attest --yes \
            "${tlog_args[@]}" \
            --type spdxjson \
            --predicate image.spdx.json \
            "$IMAGE_REF"
