version: 2

project_name: intentproof-tools

before:
  hooks:
    - go mod download

builds:
  - id: intentproof
    main: ./cmd/intentproof
    binary: intentproof
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w -buildid=
        -X github.com/intentproof/intentproof-tools/pkg/buildinfo.Version={{ .Version }}
        -X github.com/intentproof/intentproof-tools/pkg/buildinfo.Commit={{ .Commit }}
        -X github.com/intentproof/intentproof-tools/pkg/buildinfo.Date={{ .Date }}

  - id: intentproof-verify
    main: ./cmd/intentproof-verify
    binary: intentproof-verify
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w -buildid=
        -X github.com/intentproof/intentproof-tools/pkg/buildinfo.Version={{ .Version }}
        -X github.com/intentproof/intentproof-tools/pkg/buildinfo.Commit={{ .Commit }}
        -X github.com/intentproof/intentproof-tools/pkg/buildinfo.Date={{ .Date }}

archives:
  - id: intentproof
    ids:
      - intentproof
    name_template: >-
      intentproof_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

  - id: intentproof-verify
    ids:
      - intentproof-verify
    name_template: >-
      intentproof-verify_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

release:
  github:
    owner: IntentProof
    name: intentproof-tools
  draft: false
  prerelease: auto
  mode: replace

changelog:
  disable: true
